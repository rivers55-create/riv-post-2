name: Build APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.8.2
      - name: Build release APK
        run: gradle :app:assembleRelease --stacktrace
      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk RivPost-${{ github.run_number }}.apk
      - uses: actions/upload-artifact@v4
        with:
          name: RivPost-apk
          path: RivPost-*.apk
      - name: Publish APK to the apk-builds branch
        run: |
          mkdir out && cp RivPost-*.apk out/RivPost.apk
          cd out
          git init -q && git checkout -q -b apk-builds
          git add RivPost.apk
          git -c user.name="Build Bot" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -qm "APK from build ${{ github.run_number }}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" apk-builds
