name: Build APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.8.2
      - name: Add the voice call engine (from Telegram X v0.29.1.1817)
        run: |
          curl -sSL -o /tmp/tgx.apk https://github.com/TGX-Android/Telegram-X/releases/download/v0.29.1.1817/Telegram-X-0.29.1.1817.apk
          mkdir -p /tmp/tgx && cd /tmp/tgx && unzip -o -q /tmp/tgx.apk 'lib/arm64-v8a/*' 'lib/armeabi-v7a/*'
          for abi in arm64-v8a armeabi-v7a; do
            mkdir -p $GITHUB_WORKSPACE/app/src/main/jniLibs/$abi
            for so in libtgcallsjni.so libcryptox.so libsslx.so libc++_shared.so; do
              cp lib/$abi/$so $GITHUB_WORKSPACE/app/src/main/jniLibs/$abi/
            done
          done
          ls -la $GITHUB_WORKSPACE/app/src/main/jniLibs/*
      - name: Build release APK
        run: gradle :app:assembleRelease --stacktrace
      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk RivPost-${{ github.run_number }}.apk
      - uses: actions/upload-artifact@v4
        with:
          name: RivPost-apk
          path: RivPost-*.apk
      - name: Publish APK to the apk-builds branch
        run: |
          mkdir out && cp RivPost-*.apk out/RivPost.apk
          cd out
          git init -q && git checkout -q -b apk-builds
          git add RivPost.apk
          git -c user.name="Build Bot" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -qm "APK from build ${{ github.run_number }}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" apk-builds
