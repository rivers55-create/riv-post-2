name: Build Riv Post (Telegram base)
on:
  push:
    branches: [ tg ]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space and add backup memory
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost /usr/local/lib/node_modules || true
          sudo swapoff -a || true
          sudo fallocate -l 12G /swapfile2 && sudo chmod 600 /swapfile2 && sudo mkswap /swapfile2 && sudo swapon /swapfile2
          free -h
      - name: Get Telegram's source (pinned)
        run: |
          git init -q tgsrc && cd tgsrc
          git remote add origin https://github.com/DrKLO/Telegram
          git fetch -q --depth 1 origin 7be672ead283d022812d75c729d3a04dd4c2a2c6
          git checkout -q FETCH_HEAD
          git submodule update -q --init --depth 1 --jobs 8 || git submodule update -q --init --jobs 8
          du -sh .
      - name: Apply Riv Post changes
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
        run: bash tg/apply.sh tgsrc
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/cache/restore@v4
        with:
          path: ~/.ccache
          key: tg-ccache-${{ github.run_id }}
          restore-keys: tg-ccache-
      - name: NDK and tools
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "ndk;27.2.12479018" "cmake;3.22.1" > /dev/null
          sudo apt-get install -y -qq ccache ninja-build > /dev/null
          ccache -M 6G
      - name: Build
        run: |
          cd tgsrc
          chmod +x gradlew
          export CMAKE_BUILD_PARALLEL_LEVEL=3
          ./gradlew :TMessagesProj_App:assembleAfatRelease --no-daemon --max-workers=2 -Dorg.gradle.parallel=false -Dorg.gradle.jvmargs="-Xmx5g -XX:MaxMetaspaceSize=1g" > ../gradle.log 2>&1 || { grep -E "^e: |error:|What went wrong|FAILED" -A5 ../gradle.log | grep -v "warning:" | tail -120; exit 1; }
          tail -5 ../gradle.log
          ls -la $(find TMessagesProj_App/build/outputs/apk -name "*.apk")
      - name: Keep log on failure
        if: failure()
        run: |
          mkdir -p out && (grep -E "^e: |error:|What went wrong|FAILED" -A5 gradle.log | grep -v "warning:" | tail -300 > out/errors.txt; tail -80 gradle.log > out/tail.txt) || true
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: ~/.ccache
          key: tg-ccache-${{ github.run_id }}
      - name: Keep APK
        if: success()
        run: |
          mkdir -p out && cp $(find tgsrc/TMessagesProj_App/build/outputs/apk -name "*.apk" | head -1) out/RivPost-TG.apk
          if [ -f no-api-id ]; then echo "built without API ID" > out/NO_API_ID.txt; fi
      - name: Publish
        if: always()
        run: |
          mkdir -p out && cd out
          git init -q && git checkout -q -b apk-tg
          git add -A
          git -c user.name="Build Bot" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -qm "build ${{ github.run_number }}" --allow-empty
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" apk-tg
